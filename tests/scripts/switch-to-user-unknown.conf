#
# Switching to an unknown user must fail cleanly (issue #431), not assert on NULL
#

[Seat:*]
autologin-user=have-password1
user-session=default

#?*START-DAEMON
#?RUNNER DAEMON-START
#?*WAIT

# X server starts
#?XSERVER-0 START VT=7 SEAT=seat0

# Daemon connects when X server is ready
#?*XSERVER-0 INDICATE-READY
#?XSERVER-0 INDICATE-READY
#?XSERVER-0 ACCEPT-CONNECT

# Session starts
#?SESSION-X-0 START XDG_SEAT=seat0 XDG_VTNR=7 XDG_GREETER_DATA_DIR=.*/have-password1 XDG_SESSION_TYPE=x11 XDG_SESSION_DESKTOP=default USER=have-password1
#?LOGIN1 ACTIVATE-SESSION SESSION=c0
#?XSERVER-0 ACCEPT-CONNECT
#?SESSION-X-0 CONNECT-XSERVER

# Switch to a user that does not exist — must return failure without crashing
#?*SWITCH-TO-USER USERNAME=does-not-exist
#?RUNNER SWITCH-TO-USER USERNAME=does-not-exist FAILED

# Cleanup — daemon still running
#?*STOP-DAEMON
#?SESSION-X-0 TERMINATE SIGNAL=15
#?XSERVER-0 TERMINATE SIGNAL=15
#?RUNNER DAEMON-EXIT STATUS=0
