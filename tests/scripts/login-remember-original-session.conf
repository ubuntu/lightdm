#
# Returning to the originally loaded .dmrc session must rewrite .dmrc (issue #325)
#

[test-runner-config]
disable-accounts-service=true

[Seat:*]
user-session=default

#?*START-DAEMON
#?RUNNER DAEMON-START

#?XSERVER-0 START VT=7 SEAT=seat0
#?*XSERVER-0 INDICATE-READY
#?XSERVER-0 INDICATE-READY
#?XSERVER-0 ACCEPT-CONNECT

#?GREETER-X-0 START XDG_SEAT=seat0 XDG_VTNR=7 XDG_SESSION_CLASS=greeter
#?LOGIN1 ACTIVATE-SESSION SESSION=c0
#?XSERVER-0 ACCEPT-CONNECT
#?GREETER-X-0 CONNECT-XSERVER
#?GREETER-X-0 CONNECT-TO-DAEMON
#?GREETER-X-0 CONNECTED-TO-DAEMON

# have-session starts with Session=alternative in .dmrc; switch to default
#?*GREETER-X-0 AUTHENTICATE USERNAME=have-session
#?GREETER-X-0 AUTHENTICATION-COMPLETE USERNAME=have-session AUTHENTICATED=TRUE
#?*GREETER-X-0 START-SESSION SESSION=default
#?GREETER-X-0 TERMINATE SIGNAL=15

#?SESSION-X-0 START XDG_SEAT=seat0 XDG_VTNR=7 XDG_GREETER_DATA_DIR=.*/have-session XDG_SESSION_TYPE=x11 XDG_SESSION_DESKTOP=default USER=have-session
#?LOGIN1 ACTIVATE-SESSION SESSION=c1
#?XSERVER-0 ACCEPT-CONNECT
#?SESSION-X-0 CONNECT-XSERVER

#?*SESSION-X-0 LOGOUT
#?XSERVER-0 TERMINATE SIGNAL=15

#?XSERVER-0 START VT=7 SEAT=seat0
#?*XSERVER-0 INDICATE-READY
#?XSERVER-0 INDICATE-READY
#?XSERVER-0 ACCEPT-CONNECT

#?GREETER-X-0 START XDG_SEAT=seat0 XDG_VTNR=7 XDG_SESSION_CLASS=greeter
#?LOGIN1 ACTIVATE-SESSION SESSION=c2
#?XSERVER-0 ACCEPT-CONNECT
#?GREETER-X-0 CONNECT-XSERVER
#?GREETER-X-0 CONNECT-TO-DAEMON
#?GREETER-X-0 CONNECTED-TO-DAEMON

# Switch back to the originally loaded session
#?*GREETER-X-0 AUTHENTICATE USERNAME=have-session
#?GREETER-X-0 AUTHENTICATION-COMPLETE USERNAME=have-session AUTHENTICATED=TRUE
#?*GREETER-X-0 START-SESSION SESSION=alternative
#?GREETER-X-0 TERMINATE SIGNAL=15

#?SESSION-X-0 START XDG_SEAT=seat0 XDG_VTNR=7 XDG_GREETER_DATA_DIR=.*/have-session XDG_SESSION_TYPE=x11 XDG_SESSION_DESKTOP=alternative NAME=alternative USER=have-session
#?LOGIN1 ACTIVATE-SESSION SESSION=c3
#?XSERVER-0 ACCEPT-CONNECT
#?SESSION-X-0 CONNECT-XSERVER

# .dmrc must record alternative again (not stay stuck on default)
#?*CHECK-DMRC-SESSION USERNAME=have-session
#?RUNNER DMRC-SESSION USERNAME=have-session SESSION=alternative

#?*STOP-DAEMON
#?SESSION-X-0 TERMINATE SIGNAL=15
#?XSERVER-0 TERMINATE SIGNAL=15
#?RUNNER DAEMON-EXIT STATUS=0
