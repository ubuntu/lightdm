#
# Check display-setup-script is re-run when resuming from sleep (issue #428)
#

[Seat:*]
display-setup-script=test-script-hook DISPLAY-SETUP

#?*START-DAEMON
#?RUNNER DAEMON-START

# X server starts
#?XSERVER-0 START VT=7 SEAT=seat0

# Daemon connects when X server is ready
#?*XSERVER-0 INDICATE-READY
#?XSERVER-0 INDICATE-READY
#?XSERVER-0 ACCEPT-CONNECT

# Display setup runs when the display server becomes ready
#?SCRIPT-HOOK DISPLAY-SETUP XDG_SEAT=seat0

# Greeter starts
#?GREETER-X-0 START XDG_SEAT=seat0 XDG_VTNR=7 XDG_SESSION_CLASS=greeter
#?LOGIN1 ACTIVATE-SESSION SESSION=c0
#?XSERVER-0 ACCEPT-CONNECT
#?GREETER-X-0 CONNECT-XSERVER
#?GREETER-X-0 CONNECT-TO-DAEMON
#?GREETER-X-0 CONNECTED-TO-DAEMON

# Simulate resume from sleep (PrepareForSleep active=false)
#?*LOGIN1-PREPARE-FOR-SLEEP ACTIVE=FALSE

# Display setup must run again so greeter DPMS / layout scripts apply
#?SCRIPT-HOOK DISPLAY-SETUP XDG_SEAT=seat0

# Cleanup
#?*STOP-DAEMON
#?GREETER-X-0 TERMINATE SIGNAL=15
#?XSERVER-0 TERMINATE SIGNAL=15
#?RUNNER DAEMON-EXIT STATUS=0
